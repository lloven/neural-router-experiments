# dvc.yaml -- Data fetch stages only.
# Experiment stages are managed by scripts/monitor.py (orchestration replacement).

stages:
  fetch-eurovoc:
    cmd: .venv/bin/python scripts/fetch_eurovoc.py
    deps:
    - scripts/fetch_eurovoc.py
    outs:
    - data/eurovoc_labels.csv
  fetch-casas:
    cmd: .venv/bin/python scripts/fetch_casas.py
    deps:
    - scripts/fetch_casas.py
    outs:
    - data/casas_iot.csv
    - data/casas_iot_subscriptions.csv
