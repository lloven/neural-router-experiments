# dvc.yaml -- Neural Router experiment pipeline
#
# Run the full pipeline:      dvc repro
# Run a single stage:         dvc repro ablation-D1
# Check what's stale:         dvc status
# Visualize the DAG:          dvc dag
#
# Parameters are tracked in params.yaml. Changing a parameter
# triggers re-execution of only the affected stages.

stages:
  # ─── Data fetching ───────────────────────────────────────
  fetch-eurovoc:
    cmd: python scripts/fetch_eurovoc.py
    deps:
      - scripts/fetch_eurovoc.py
    outs:
      - data/eurovoc_labels.csv

  # ─── Ablation experiments (per dataset) ──────────────────
  ablation-D1:
    cmd: >-
      python scripts/run_experiment.py
        --dataset D1
        --configs all
        --baselines all
        --output-dir results/ablation
        --output-tag D1_ablation
    deps:
      - scripts/run_experiment.py
      - src/router.py
      - src/evaluation.py
      - src/baselines.py
      - src/embeddings.py
      - src/llm.py
      - src/data.py
    params:
      - ablation
      - seeds
      - baselines
    outs:
      - results/ablation/D1_ablation_results.csv
      - results/ablation/D1_ablation_results.json

  ablation-D2:
    cmd: >-
      python scripts/run_experiment.py
        --dataset D2
        --configs all
        --baselines all
        --output-dir results/ablation
        --output-tag D2_ablation
    deps:
      - scripts/run_experiment.py
      - src/router.py
      - src/evaluation.py
      - src/baselines.py
      - src/embeddings.py
      - src/llm.py
      - src/data.py
      - data/eurovoc_labels.csv
    params:
      - ablation
      - seeds
      - baselines
    outs:
      - results/ablation/D2_ablation_results.csv
      - results/ablation/D2_ablation_results.json

  ablation-D3:
    cmd: >-
      python scripts/run_experiment.py
        --dataset D3
        --configs all
        --baselines all
        --output-dir results/ablation
        --output-tag D3_ablation
    deps:
      - scripts/run_experiment.py
      - src/router.py
      - src/evaluation.py
      - src/baselines.py
      - src/embeddings.py
      - src/llm.py
      - src/data.py
    params:
      - ablation
      - seeds
      - baselines
    outs:
      - results/ablation/D3_ablation_results.csv
      - results/ablation/D3_ablation_results.json

  # ─── Sensitivity sweeps (per dataset) ───────────────────
  sensitivity-D1:
    cmd: >-
      python scripts/run_sensitivity.py
        --dataset D1
        --sweep all
        --output-dir results/sensitivity
    deps:
      - scripts/run_sensitivity.py
      - src/router.py
      - src/evaluation.py
      - src/embeddings.py
      - src/llm.py
      - src/data.py
    params:
      - sensitivity
    outs:
      - results/sensitivity/sensitivity_k_D1.csv
      - results/sensitivity/sensitivity_tau_D1.csv
      - results/sensitivity/sensitivity_kappa_D1.csv
      - results/sensitivity/sensitivity_embedding_D1.csv

  sensitivity-D2:
    cmd: >-
      python scripts/run_sensitivity.py
        --dataset D2
        --sweep all
        --output-dir results/sensitivity
    deps:
      - scripts/run_sensitivity.py
      - src/router.py
      - src/evaluation.py
      - src/embeddings.py
      - src/llm.py
      - src/data.py
      - data/eurovoc_labels.csv
    params:
      - sensitivity
    outs:
      - results/sensitivity/sensitivity_k_D2.csv
      - results/sensitivity/sensitivity_tau_D2.csv
      - results/sensitivity/sensitivity_kappa_D2.csv
      - results/sensitivity/sensitivity_embedding_D2.csv

  sensitivity-D3:
    cmd: >-
      python scripts/run_sensitivity.py
        --dataset D3
        --sweep all
        --output-dir results/sensitivity
    deps:
      - scripts/run_sensitivity.py
      - src/router.py
      - src/evaluation.py
      - src/embeddings.py
      - src/llm.py
      - src/data.py
    params:
      - sensitivity
    outs:
      - results/sensitivity/sensitivity_k_D3.csv
      - results/sensitivity/sensitivity_tau_D3.csv
      - results/sensitivity/sensitivity_kappa_D3.csv
      - results/sensitivity/sensitivity_embedding_D3.csv

  # ─── Scaling analysis (per dataset) ─────────────────────
  scaling-events-D1:
    cmd: >-
      python scripts/run_scaling.py
        --dataset D1
        --dimension events
        --output-dir results/scaling
    deps:
      - scripts/run_scaling.py
      - src/router.py
      - src/evaluation.py
      - src/embeddings.py
      - src/llm.py
      - src/data.py
    params:
      - scaling
    outs:
      - results/scaling/scaling_events_D1.csv

  scaling-events-D2:
    cmd: >-
      python scripts/run_scaling.py
        --dataset D2
        --dimension events
        --output-dir results/scaling
    deps:
      - scripts/run_scaling.py
      - src/router.py
      - src/evaluation.py
      - src/embeddings.py
      - src/llm.py
      - src/data.py
      - data/eurovoc_labels.csv
    params:
      - scaling
    outs:
      - results/scaling/scaling_events_D2.csv

  scaling-subs-D2:
    cmd: >-
      python scripts/run_scaling.py
        --dataset D2
        --dimension subscriptions
        --output-dir results/scaling
    deps:
      - scripts/run_scaling.py
      - src/router.py
      - src/evaluation.py
      - src/embeddings.py
      - src/llm.py
      - src/data.py
      - data/eurovoc_labels.csv
    params:
      - scaling
    outs:
      - results/scaling/scaling_subs_D2.csv

  scaling-events-D3:
    cmd: >-
      python scripts/run_scaling.py
        --dataset D3
        --dimension events
        --output-dir results/scaling
    deps:
      - scripts/run_scaling.py
      - src/router.py
      - src/evaluation.py
      - src/embeddings.py
      - src/llm.py
      - src/data.py
    params:
      - scaling
    outs:
      - results/scaling/scaling_events_D3.csv

  scaling-subs-D3:
    cmd: >-
      python scripts/run_scaling.py
        --dataset D3
        --dimension subscriptions
        --output-dir results/scaling
    deps:
      - scripts/run_scaling.py
      - src/router.py
      - src/evaluation.py
      - src/embeddings.py
      - src/llm.py
      - src/data.py
    params:
      - scaling
    outs:
      - results/scaling/scaling_subs_D3.csv
